<!DOCTYPE html>

<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Vercel Blob Database
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            font-family:
                Arial,
                sans-serif;

            background:
                #f5f5f5;

            margin:
                0;

            padding:
                20px;

        }


        .container {

            max-width:
                800px;

            margin:
                auto;

        }


        .form {

            background:
                white;

            padding:
                20px;

            border-radius:
                10px;

            margin-bottom:
                20px;

        }


        input,
        textarea {

            width:
                100%;

            padding:
                10px;

            margin-bottom:
                10px;

            border:
                1px solid #ddd;

            border-radius:
                6px;

            font-size:
                16px;

        }


        textarea {

            min-height:
                100px;

            resize:
                vertical;

        }


        button {

            padding:
                8px 14px;

            border:
                none;

            border-radius:
                6px;

            cursor:
                pointer;

            margin-right:
                5px;

        }


        .add {

            background:
                #2196f3;

            color:
                white;

        }


        .item {

            background:
                white;

            padding:
                15px;

            border-radius:
                10px;

            margin-bottom:
                10px;

        }


        .date {

            color:
                #888;

            font-size:
                13px;

        }


        .name {

            font-weight:
                bold;

            margin:
                8px 0;

        }


        .message {

            white-space:
                pre-wrap;

            margin-bottom:
                10px;

        }

    </style>

</head>


<body>


<div class="container">


    <h1>
        Danh sách lời chúc moi
    </h1>


    <div class="form">


        <input
            id="name"
            placeholder="Tên"
        >


        <textarea
            id="message"
            placeholder="Lời chúc"
        ></textarea>


        <button
            class="add"
            onclick="addMessage()"
        >
            Thêm
        </button>


    </div>


    <div id="list"></div>


</div>


<script
    src="./script.js"
></script>


</body>

</html>
